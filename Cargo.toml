[package]
name = "sf-compact"
version = "0.1.0"
edition = "2021"
description = "Convert Salesforce metadata XML to AI-friendly YAML and back. Lossless roundtrip."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
walkdir = "2"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
