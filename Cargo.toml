[package]
name = "sf-compact"
version = "0.2.0"
edition = "2021"
description = "Convert Salesforce metadata XML to AI-friendly YAML and back. Semantically lossless roundtrip."
license = "MIT"
repository = "https://github.com/vradko/sf-compact"
homepage = "https://github.com/vradko/sf-compact"
keywords = ["salesforce", "metadata", "yaml", "ai", "token-optimization"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
exclude = ["tests/", ".github/", "target/", "SF_COMPACT.md"]

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = "0.39"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
walkdir = "2"
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
tiktoken-rs = "0.9.1"
glob = "0.3"
rayon = "1.10"
notify = { version = "8", features = ["macos_fsevent"] }
notify-debouncer-mini = "0.7"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
walkdir = "2"
